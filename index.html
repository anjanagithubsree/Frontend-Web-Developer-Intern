<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="ExploreSpace - A Single Page Application Simulation">

    <title>ExploreSpace | SPA Simulation</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <a href="#main-content" class="skip-link">
        Skip to content
    </a>

    <div class="app-container">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">

            <div class="logo">
                <span class="logo-icon">✦</span>
                <h2>Explore<span>Space</span></h2>
                <p>SPA SIMULATION</p>
            </div>

            <h4 class="menu-title">WORKSPACE</h4>

            <nav class="navigation" aria-label="Main navigation">

                <a href="#/home" class="nav-link">
                    🏠 Home
                </a>

                <a href="#/explore" class="nav-link">
                    🔍 Explore
                </a>

                <a href="#/favorites" class="nav-link">
                    ❤️ Favorites
                    <span id="favorite-count">0</span>
                </a>

                <a href="#/about" class="nav-link">
                    ℹ️ About
                </a>

            </nav>

            <div class="sidebar-footer">
                <p>🟢 Client-side routing active</p>
                <small>
                    Navigate without refreshing the page.
                </small>
            </div>

        </aside>

        <!-- Main Application -->
        <div class="main-wrapper">

            <header class="header">

                <div class="breadcrumb">
                    YOUR WORKSPACE /
                    <span id="current-page">Home</span>
                </div>

                <div class="status">
                    ● SPA ONLINE
                </div>

            </header>

            <!-- Dynamic Content Container -->
            <main id="main-content"
                  tabindex="-1"
                  aria-live="polite">

                <!-- JavaScript loads content here -->

                <noscript>
                    Please enable JavaScript to use this application.
                </noscript>

            </main>

            <footer class="footer">

                <p>
                    ExploreSpace © 2026 |
                    Week 5 SPA Simulation
                </p>

                <p>
                    Built using HTML, CSS and JavaScript
                </p>

            </footer>

        </div>

    </div>

    <!-- Notification -->
    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite">
    </div>

</body>
</html>
